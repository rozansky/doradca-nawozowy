<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototypy logo</title>
<style>
  :root { --tlo:#f6f8f3; --karta:#fff; --tekst:#1f2a1f; --slaby:#5b6b5b; --akcent:#2f7d32; --ramka:#dfe6da; }
  body { margin:0; padding:24px 16px; background:var(--tlo); color:var(--tekst); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:1.4rem; margin:0 0 4px; } p.opis { color:var(--slaby); margin:0 0 24px; }
  .siatka { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; max-width:1100px; }
  .karta { background:var(--karta); border:1px solid var(--ramka); border-radius:14px; overflow:hidden; }
  .karta h2 { font-size:1rem; margin:0; padding:12px 16px 0; } .karta .pod { color:var(--slaby); font-size:.85rem; padding:2px 16px 12px; margin:0; }
  .duze { display:grid; grid-template-columns:1fr 1fr; }
  .duze div { display:grid; place-items:center; padding:20px; } .duze img { width:96px; height:96px; }
  .ciemne { background:#1b221b; }
  .naglowek { display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--ramka); font-weight:700; font-size:1.15rem; color:var(--akcent); }
  .naglowek img { width:32px; height:32px; }
  .male { display:flex; align-items:center; gap:12px; padding:0 16px 14px; color:var(--slaby); font-size:.8rem; }
  .male img:first-child { width:16px; height:16px; } .male img:nth-child(2) { width:24px; height:24px; }
</style>
</head>

  ['2-kielek.svg', '2. Kiełek z granulkami NPK', 'Kiełek nad glebą, pod nią granulki w kolorach N, P, K ze strony.'],
